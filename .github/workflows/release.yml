name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, Package & Release
    runs-on: macos-26
    env:
      # Secrets can't be read in a step's `if`, so expose only whether this one is set.
      HAS_PIXERATE_PACKAGES_TOKEN: ${{ secrets.PIXERATE_PACKAGES_TOKEN != '' }}
      HAS_APP_STORE_CONNECT: ${{ secrets.APP_STORE_CONNECT_API_KEY != '' && secrets.APP_STORE_CONNECT_KEY_ID != '' && secrets.APP_STORE_CONNECT_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history for proper changelog/release notes generation

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check for Pending Changesets
        id: changeset_check
        run: |
          CHANGESETS=$(find .changeset -name "*.md" ! -name "README.md" | wc -l)
          echo "count=$CHANGESETS" >> $GITHUB_OUTPUT
          if [ "$CHANGESETS" -gt "0" ]; then
            echo "Pending changesets found: $CHANGESETS"
          else
            echo "No pending changesets found. Skipping release."
          fi

      - name: Version Packages & Update Changelogs
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        id: versioning
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npx changeset version
          npm install --package-lock-only --no-audit --no-fund
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Xcode
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Signing Certificate
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'ci-keychain-pass' }}
          EXPLICIT_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "No MACOS_CERTIFICATE secret provided. Reverting to default ad-hoc workflow."
            exit 0
          fi

          echo "Importing Apple Code Signing Certificate..."
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$MACOS_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          IDENTITY="$EXPLICIT_IDENTITY"
          if [ -z "$IDENTITY" ]; then
            IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -o '".*"' | head -1 | tr -d '"')
          fi

          echo "Found Signing Identity: $IDENTITY"
          echo "CODE_SIGN_IDENTITY=$IDENTITY" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      # Packages/PixerateStickers is an MIT-safe stub with no artwork, so anyone can build Swash.
      # Official builds swap in the private Pixerate/stickers package when the token is set (#62).
      # Without the secret this step is skipped and the build keeps the stub.
      - name: Inject Proprietary Stickers
        if: (steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch') && env.HAS_PIXERATE_PACKAGES_TOKEN == 'true'
        env:
          PIXERATE_PACKAGES_TOKEN: ${{ secrets.PIXERATE_PACKAGES_TOKEN }}
        run: |
          rm -rf Packages/PixerateStickers
          git clone --depth 1 --branch v0.9.0 \
            "https://x-access-token:${PIXERATE_PACKAGES_TOKEN}@github.com/Pixerate/stickers.git" \
            Packages/PixerateStickers
          test -d Packages/PixerateStickers/swift/Sources/PixerateStickers/Resources/Stickers.xcassets

      - name: Build macOS App
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ env.VERSION }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          BUILD_NUMBER="${{ github.run_number }}"

          if [ -n "$CODE_SIGN_IDENTITY" ]; then
            echo "Building Swash with Code Sign Identity: $CODE_SIGN_IDENTITY"
            xcodebuild -scheme Swash \
              -destination 'generic/platform=macOS' \
              -configuration Release \
              -derivedDataPath build \
              CODE_SIGN_STYLE="Manual" \
              CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
              OTHER_CODE_SIGN_FLAGS="--options runtime --keychain $KEYCHAIN_PATH" \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          else
            echo "No MACOS_CERTIFICATE found. Falling back to default ad-hoc signing."
            xcodebuild -scheme Swash \
              -destination 'generic/platform=macOS' \
              -configuration Release \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="-" \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          fi

      - name: Package App Bundle & Sign DMG
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        run: |
          APP_PATH="build/Build/Products/Release/Swash.app"

          if [ -n "$CODE_SIGN_IDENTITY" ]; then
            echo "Verifying Swash.app code signature..."
            codesign --verify --verbose=4 --deep --strict "$APP_PATH" || true
            codesign -dv --verbose=4 "$APP_PATH"
          fi

          # Create ZIP archive
          cd build/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/Swash-macOS.zip" Swash.app
          cd "$GITHUB_WORKSPACE"

          # Create DMG Disk Image
          mkdir dmg_root
          cp -R "$APP_PATH" dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Swash" -srcfolder dmg_root -ov -format UDZO Swash-macOS.dmg
          rm -rf dmg_root

          # Code Sign DMG if identity is available
          if [ -n "$CODE_SIGN_IDENTITY" ]; then
            echo "Codesigning Swash-macOS.dmg..."
            codesign --force --sign "$CODE_SIGN_IDENTITY" --keychain "$KEYCHAIN_PATH" Swash-macOS.dmg
            echo "Verifying Swash-macOS.dmg code signature..."
            codesign --verify --verbose=4 --strict Swash-macOS.dmg
            codesign -dv --verbose=4 Swash-macOS.dmg
          fi

      - name: Notarize & Staple
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$PASSWORD" ] || [ -z "$TEAM_ID" ]; then
            echo "Notarization secrets omitted. Skipping notarization."
            exit 0
          fi

          APP_PATH="build/Build/Products/Release/Swash.app"

          echo "Submitting Swash-macOS.dmg for Apple Notarization..."
          xcrun notarytool submit Swash-macOS.dmg \
            --apple-id "$APPLE_ID" \
            --password "$PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

          echo "Stapling notarization ticket to Swash-macOS.dmg..."
          xcrun staple Swash-macOS.dmg

          echo "Stapling notarization ticket to Swash.app..."
          xcrun staple "$APP_PATH" || true

          # Update Swash-macOS.zip with the stapled app bundle
          echo "Updating Swash-macOS.zip with stapled Swash.app..."
          rm -f "$GITHUB_WORKSPACE/Swash-macOS.zip"
          cd build/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/Swash-macOS.zip" Swash.app
          cd "$GITHUB_WORKSPACE"

      - name: Generate Sparkle Appcast
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "Downloading Sparkle CLI tools for appcast generation..."
          SPARKLE_TOOL_URL="https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz"
          mkdir -p sparkle_tools
          curl -sL "$SPARKLE_TOOL_URL" | tar -xJ -C sparkle_tools

          echo "Preparing release directory for Sparkle appcast generation..."
          mkdir -p sparkle_release
          cp Swash-macOS.zip sparkle_release/
          
          VERSION="${{ env.VERSION }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          DOWNLOAD_URL_PREFIX="https://github.com/Pixerate/Swash/releases/download/v${VERSION}/"

          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            echo "Generating and signing appcast.xml with SPARKLE_PRIVATE_KEY..."
            echo "$SPARKLE_PRIVATE_KEY" | ./sparkle_tools/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "$DOWNLOAD_URL_PREFIX" \
              sparkle_release/
          else
            echo "No SPARKLE_PRIVATE_KEY provided. Generating unsigned appcast.xml..."
            ./sparkle_tools/bin/generate_appcast \
              --download-url-prefix "$DOWNLOAD_URL_PREFIX" \
              sparkle_release/
          fi

          cp sparkle_release/appcast.xml appcast.xml

      - name: Generate README Screenshot
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        run: |
          chmod +x scripts/generate_screenshot.sh
          ./scripts/generate_screenshot.sh || echo "Screenshot generation skipped or failed gracefully."

      - name: Commit Version Bumps & Repository Assets on Main Branch
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Screenshot.png appcast.xml package.json package-lock.json CHANGELOG.md .changeset
          if git commit -m "chore(release): v${{ env.VERSION }} [skip ci]"; then
            git push origin HEAD:main || true
          fi

      - name: Create GitHub Release
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          name: Swash v${{ env.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            Swash-macOS.dmg
            Swash-macOS.zip
            appcast.xml

      # iPhone and iPad. These run after the macOS release is published, so an iOS failure can't
      # hold it up. Without App Store Connect secrets the archive is unsigned: it checks that the
      # iOS release build works (with the real sticker pack when it was injected above). With them,
      # Xcode signs automatically through the API key and the build is uploaded to TestFlight.
      - name: Archive iOS App
        if: steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch'
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${{ env.VERSION }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          BUILD_NUMBER="${{ github.run_number }}"
          ARCHIVE_PATH="build/Swash-iOS.xcarchive"

          if [ "$HAS_APP_STORE_CONNECT" = "true" ]; then
            echo "Archiving a signed iOS build for TestFlight..."
            API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
            echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode -o "$API_KEY_PATH"
            echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
            xcodebuild archive -scheme Swash \
              -destination 'generic/platform=iOS' \
              -configuration Release \
              -derivedDataPath build-ios \
              -archivePath "$ARCHIVE_PATH" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$API_KEY_PATH" \
              -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
              -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
              CODE_SIGN_STYLE=Automatic \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          else
            echo "App Store Connect secrets omitted. Archiving an unsigned iOS build as a check only."
            xcodebuild archive -scheme Swash \
              -destination 'generic/platform=iOS' \
              -configuration Release \
              -derivedDataPath build-ios \
              -archivePath "$ARCHIVE_PATH" \
              CODE_SIGNING_ALLOWED=NO \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          fi

          PLUGINS="$ARCHIVE_PATH/Products/Applications/Swash.app/PlugIns"
          ls "$PLUGINS"
          # The sticker pack is embedded only when the real stickers package was injected (#62)
          if [ "$HAS_PIXERATE_PACKAGES_TOKEN" = "true" ] && [ ! -d "$PLUGINS/SwashStickers.appex" ]; then
            echo "::error::The stickers package was injected, but SwashStickers.appex is missing from the iOS app."
            exit 1
          fi

      - name: Upload iOS App to TestFlight
        if: (steps.changeset_check.outputs.count > 0 || github.event_name == 'workflow_dispatch') && env.HAS_APP_STORE_CONNECT == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Swash-iOS.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/Swash-iOS-export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          echo "Uploaded Swash v${{ env.VERSION }} (${{ github.run_number }}) to TestFlight."

      - name: Clean up Keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [ -n "$API_KEY_PATH" ]; then
            rm -f "$API_KEY_PATH"
          fi
