name: PR Build

# Builds the app with the same runner and Xcode as the release workflow, so code that only
# compiles with a newer local SDK is caught before it reaches main.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS App
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build (Release, ad-hoc signed)
        run: |
          xcodebuild -scheme Swash \
            -destination 'generic/platform=macOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-"

      - name: Math and Mermaid rendering tests
        run: scripts/run_rich_render_tests.sh

      # PixerateMarkdown (the Markdown engine, from the Pixerate editor repo) at the pinned revision:
      # the CommonMark and GFM spec examples, its parser checks, and the shared editing corpus
      - name: CommonMark and GFM spec tests
        run: scripts/run_commonmark_spec.sh

      - name: Paste conversion tests (Swash's engine additions)
        run: scripts/run_paste_tests.sh

      - name: Slack mrkdwn parsing and formatting tests
        run: scripts/run_slack_tests.sh

      - name: Markdown conformance tests (@pixerate/markdown-conformance)
        run: scripts/run_conformance_tests.sh

      - name: Agent tools tests (MCP bridge tools through a PixerateCore ToolRegistry)
        run: scripts/run_agent_tools_tests.sh

      - name: MacAppKitExtras package tests
        run: swift test --package-path Packages/MacAppKitExtras

  build-ios:
    name: Build iOS App (Simulator)
    runs-on: macos-26
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (Release, iOS Simulator, unsigned)
        run: |
          xcodebuild -scheme Swash \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      # The Edit Text editor tests (Tests/SwashiOSTests), hosted by the app on an iPhone simulator
      - name: iOS editor tests (Simulator)
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in runtimes if ".iOS-" in r), key=lambda r: [int(p) for p in r.rsplit(".iOS-", 1)[1].split("-")], reverse=True)
          print(next(d["udid"] for r in ios for d in runtimes[r] if d["name"].startswith("iPhone")))
          ')
          echo "Testing on $(xcrun simctl list devices | grep "$DEVICE_ID")"
          xcodebuild test -scheme Swash \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -configuration Debug \
            -derivedDataPath build-tests \
            -resultBundlePath build-tests/SwashiOSTests.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SwashiOSTests.xcresult
          path: build-tests/SwashiOSTests.xcresult
