name: Site check

# Builds the marketing site (site/) on pull requests that touch it. Publishing isn't done here:
# Firebase App Hosting rolls out swash.pixerate.com from main by itself (GOTCHAS #80).
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site-check.yml'

concurrency:
  group: site-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
